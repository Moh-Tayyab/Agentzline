name: CI / Test Suite

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Pytest Suite & Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Pytest with In-Memory Test DB
        env:
          ENVIRONMENT: "testing"
          DEBUG: "false"
          FERNET_ENCRYPTION_KEY: "Znl1dWhiZmpid2VmaWpiaWZoZXduaWVmaXdlaWZod2U="
          ACTION_TOKEN_SECRET: "test_action_token_secret_for_ci_32chars"
        run: |
          uv run pytest tests/ -v --durations=10
