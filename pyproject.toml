[project]
name = "agentzline"
version = "0.1.0"
description = "Hyper-Focused AI Media Buyer Engine — Bronze Tier MVP (Meta Ads Read-Only + WhatsApp Daily Reports)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "AgentZline Team"},
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",

    # Validation & settings
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",

    # HTTP client (Meta Graph API + WhatsApp Cloud API)
    "httpx>=0.27.0,<1.0.0",

    # AI & Agent orchestration
    "anthropic>=0.30.0,<1.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-anthropic>=0.2.0,<1.0.0",

    # Task scheduling
    "apscheduler>=3.10.0,<4.0.0",

    # Security & encryption
    "cryptography>=43.0.0,<44.0.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "loguru>=0.7.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
